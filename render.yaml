services:
  - type: web
    name: teacher-resume-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon (or other Postgres) connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel frontend URL, e.g. https://your-app.vercel.app
